[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    integration: requires live services (PostgreSQL/pgvector, ChromaDB, Neo4j). Skipped by default; run with `-m integration`.
    unit: fast, no external services. Safe to run anywhere (the default refactor guard).
